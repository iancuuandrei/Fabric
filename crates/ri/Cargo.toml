[package]
name = "engorch-ri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Immutable repository evidence and navigation for EngOrch"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sha1 = "0.10.6"
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
prost = "0.14.4"
tgrep-core = { git = "https://github.com/microsoft/tgrep", rev = "e2007b52d2b8fe4176159d0da20c9ba4a46d5aab" }
regex = "1"

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
tempfile = "3"
